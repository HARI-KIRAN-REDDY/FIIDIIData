name: Update NSE Index Constituents

on:
  schedule:
    - cron: "30 2 1,16 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python index_constituents_getter.py
      - run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add index_constituents.csv
          git diff --staged --quiet || (git commit -m "chore: update index_constituents.csv" && git push)
